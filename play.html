<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Samsung Galaxy感謝祭｜回答画面</title>
<style>
  :root { --cyan: #4fd2ff; --ice: #d6ecff; --muted: #9fb6e6; --line: #2a4a9e; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: #020a24; }
  body { font-family: "Meiryo UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; color: #fff; min-height: 100vh; padding: 16px;
    background:
      radial-gradient(2px 2px at 15% 20%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 12%, #bfe6ff 50%, transparent 51%),
      radial-gradient(2px 2px at 85% 65%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 30% 80%, #fff 50%, transparent 51%),
      radial-gradient(ellipse 90% 50% at 50% -10%, #1d3fbf 0%, transparent 62%),
      linear-gradient(180deg, #010618 0%, #041646 58%, #020a24 100%);
    background-attachment: fixed; }
  h1.logo { text-align: center; font-size: 30px; margin: 6px 0 14px; line-height: 1.2;
    background: linear-gradient(180deg, #ffffff 20%, #bfe6ff 55%, #4fd2ff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(79,210,255,.55)); }
  h1.logo .brand { display: block; font-size: 14px; letter-spacing: .3em; }
  .card { background: rgba(6,20,64,.88); border: 1px solid rgba(79,210,255,.45); border-radius: 16px; padding: 20px; margin-bottom: 16px; position: relative; z-index: 1;
    box-shadow: 0 0 24px rgba(61,139,255,.22), inset 0 0 40px rgba(20,40,160,.3); }
  input, select { width: 100%; font-family: inherit; font-size: 20px; padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: #06123a; color: #fff; margin: 6px 0 12px; text-align: center; }
  button.join { width: 100%; font-family: inherit; font-size: 20px; font-weight: bold; border: none; border-radius: 999px; padding: 15px; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, #5aa2ff, #2a5fe0 55%, #1428a0); box-shadow: 0 4px 0 #0a1660, 0 0 16px rgba(79,210,255,.35); }
  .msg { text-align: center; font-size: 19px; line-height: 1.6; }
  .big { font-size: 29px; font-weight: bold; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .abtn { font-family: inherit; border: 3px solid rgba(255,255,255,.75); border-radius: 16px; min-height: 128px; font-size: 44px; font-weight: bold; color: #fff; cursor: pointer; position: relative; overflow: hidden;
    box-shadow: inset 0 -12px 20px rgba(0,0,0,.35), inset 0 8px 16px rgba(255,255,255,.25), 0 5px 12px rgba(0,0,0,.5); text-shadow: 0 2px 4px rgba(0,0,0,.5); }
  .abtn small { display: block; font-size: 15px; font-weight: normal; margin-top: 4px; padding: 0 6px; }
  .c0 { background: linear-gradient(180deg, #ff5f7a, #d21f3c 60%, #a3122a); }
  .c1 { background: linear-gradient(180deg, #4d94ff, #1256c9 60%, #0b3d94); }
  .c2 { background: linear-gradient(180deg, #ffd94d, #d99a00 60%, #a87400); }
  .c3 { background: linear-gradient(180deg, #3ecf7f, #0d8a4d 60%, #076b3a); }
  .abtn.pred { border-style: dashed; }
  .abtn.picked { outline: 5px solid #fff; animation: pickedPulse .45s ease-in-out infinite alternate; }
  @keyframes pickedPulse { from { transform: scale(.97); } to { transform: scale(1); box-shadow: 0 0 22px rgba(255,255,255,.85); } }
  .abtn:disabled { opacity: .45; }
  .abtn.dim { opacity: .25; }
  .abtn::after { content: ""; position: absolute; top: 0; left: -90%; width: 45%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.5), transparent);
    transform: skewX(-20deg); animation: shine 2.8s ease-in-out infinite; pointer-events: none; }
  .abtn:disabled::after { animation: none; }
  @keyframes shine { 0%, 50% { left: -90%; } 85%, 100% { left: 140%; } }
  .hidden { display: none !important; }
  .warn { background: #3a1420; border: 1px solid #a33; color: #fbb; padding: 12px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
  .timer { text-align: center; font-size: 52px; font-weight: bold; color: var(--cyan); text-shadow: 0 0 20px rgba(79,210,255,.65); margin-bottom: 8px; line-height: 1.1; min-height: 57px; }
  .timer.danger { color: #ff5f7a; animation: pulseP .5s infinite alternate; }
  @keyframes pulseP { from { transform: scale(1); } to { transform: scale(1.12); } }
  .consultT { color: #8ef0c1; }
  .out { color: #ff8098; }
  .badge { display: inline-block; font-size: 15px; padding: 3px 12px; border-radius: 999px; margin-bottom: 8px; border: 1px solid var(--line); background: #0b1a4d; }
  .badge.predB { color: #e0c8ff; border-color: #9a6bff; }
  .teampoints { text-align: center; font-size: 17px; color: var(--cyan); margin-top: 8px; }
  #stampBar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: rgba(2,10,36,.94); border-top: 1px solid var(--line); display: flex; gap: 10px; justify-content: center; z-index: 40; }
  #stampBar button { font-size: 26px; border-radius: 999px; border: 1px solid rgba(79,210,255,.5); background: linear-gradient(180deg, #1c2f6e, #12204f); padding: 8px 22px; cursor: pointer; }
  #stampBar button:active { transform: scale(.94); }
  .spacer { height: 76px; }
  .win { animation: winBounce .55s ease 2; color: #fff !important; text-shadow: 0 0 18px rgba(79,210,255,.95); }
  @keyframes winBounce { 0% { transform: scale(1); } 40% { transform: scale(1.16); } 100% { transform: scale(1); } }
  #ansCard.predMode { border-color: #b48cff; background: rgba(34,14,72,.92); box-shadow: 0 0 26px rgba(154,107,255,.45); }
  .predBanner { text-align: center; font-size: 22px; font-weight: bold; color: #f0e4ff; background: linear-gradient(90deg, #5b2bb5, #8a4dff, #5b2bb5); border-radius: 12px; padding: 10px; margin-bottom: 10px; line-height: 1.4; }
  .predBanner small { display: block; font-size: 14px; font-weight: normal; }
  .abtn.wait { filter: grayscale(.55) brightness(.8); }
  .abtn.wait::after { animation: none; }
  #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); background: rgba(255,95,122,.95); color: #fff; font-size: 22px; font-weight: bold; padding: 16px 24px; border-radius: 14px; z-index: 80; text-align: center; pointer-events: none; white-space: pre-line; }
  #connDot { position: fixed; top: 10px; right: 12px; z-index: 90; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: rgba(2,10,36,.9); border: 1px solid var(--line); }
  #connDot.bad { background: #8a1a2e; border-color: #ff5f7a; color: #fff; font-size: 15px; font-weight: bold; animation: pulseP .6s infinite alternate; }
  .pingBtn { width: 100%; min-height: 180px; font-family: inherit; font-size: 30px; font-weight: bold; color: #fff; border: 3px solid #fff; border-radius: 20px; cursor: pointer;
    background: linear-gradient(180deg, #3ecf7f, #0d8a4d); box-shadow: 0 0 30px rgba(62,207,127,.6); }
  .pingBtn:disabled { background: #1c2f6e; box-shadow: none; font-size: 24px; }
  .sendState { font-size: 17px; margin-top: 6px; }
  .sendState.ok { color: #8ef0c1; }
  .sendState.slow { color: #ffb3c0; font-weight: bold; }
  .notice { margin: 14px 0 4px; padding: 12px 14px; border-radius: 12px; border: 1px solid #ffd94d; background: rgba(90,70,0,.35); font-size: 16px; line-height: 1.8; }
  .notice b { color: #ffe27a; }
  .notice .nt { text-align: center; font-weight: bold; color: #ffe27a; margin-bottom: 4px; }
  .dblBadge { display: inline-block; background: linear-gradient(90deg, #ff5f7a, #ffb000); color: #fff; font-weight: bold; border-radius: 999px; padding: 4px 16px; font-size: 17px; margin-bottom: 6px; }
  .link { background: none; border: none; color: var(--muted); text-decoration: underline; font-size: 14px; margin-top: 10px; width: 100%; cursor: pointer; font-family: inherit; }
</style>
</head>
<body>
  <h1 class="logo"><span class="brand">Samsung Galaxy</span>感謝祭</h1>
  <div id="configWarn" class="warn hidden">Firebaseの設定がまだ貼られていません。主催者に確認してください。</div>

  <!-- 参加 -->
  <div class="card" id="joinCard">
    <p class="msg">大画面の4けた番号を入れてね</p>
    <input id="pinIn" type="tel" inputmode="numeric" maxlength="4" placeholder="番号（例：1234）">
    <button class="join" id="pinBtn">番号を確認</button>
    <div id="joinStep2" class="hidden">
      <p class="msg" style="margin-top:10px">自分のチームと名前を選んでね</p>
      <select id="teamSel"></select>
      <input id="nameIn" type="text" maxlength="12" placeholder="名前（例：たろう）">
      <button class="join" id="joinBtn">参加する</button>
    </div>
    <p class="msg" id="joinErr" style="color:#ff8098;font-size:16px"></p>
  </div>

  <!-- 待機 -->
  <div class="card hidden" id="waitCard">
    <p class="msg big" id="waitName"></p>
    <p class="msg" id="waitTeam"></p>
    <p class="msg" id="waitMsg">参加できたよ！<br>クイズ開始まで待っててね</p>
    <div class="notice" id="noticeBox"></div>
    <p class="msg" style="font-size:14px;color:var(--muted);margin-top:8px">もし画面が消えても、もう一度このページを開けば続きから参加できます</p>
    <p class="teampoints" id="waitPoints"></p>
  </div>

  <!-- 相談 -->
  <div class="card hidden" id="consultCard">
    <div class="timer consultT" id="consultTimer"></div>
    <p class="msg big">🗣 相談タイム！</p>
    <p class="msg" id="consultQ"></p>
    <p class="msg">チームで話し合おう。<br>回答はこのあと始まるよ</p>
  </div>

  <!-- 回答・予想 -->
  <div class="card hidden" id="ansCard">
    <div class="predBanner hidden" id="predBanner"></div>
    <div style="text-align:center"><span class="dblBadge hidden" id="dblBadge">🔥 この問題はチーム得点2倍！</span></div>
    <div style="text-align:center"><span class="badge" id="roleBadge"></span></div>
    <div class="timer" id="timerView"></div>
    <p class="msg" id="qTextP" style="margin-bottom:12px"></p>
    <div class="grid" id="btnGrid"></div>
    <p class="msg" id="pickedMsg" style="margin-top:12px"></p>
    <p class="msg sendState" id="sendState"></p>
  </div>

  <!-- 接続チェック -->
  <div class="card hidden" id="pingCard">
    <p class="msg big" style="margin-bottom:12px">📶 接続チェック</p>
    <button class="pingBtn" id="pingBtn">ここをタップ！</button>
    <p class="msg" id="pingMsg" style="margin-top:12px">司会の画面にあなたの名前が出るか確認します</p>
  </div>

  <!-- 結果 -->
  <div class="card hidden" id="resultCard">
    <p class="msg big" id="resultMsg"></p>
    <p class="msg" id="resultSub"></p>
    <p class="teampoints" id="resultPoints"></p>
  </div>

  <div id="toast" class="hidden"></div>
  <div id="connDot" class="hidden"></div>
  <p class="teampoints" id="audView"></p>
  <div class="spacer"></div>
  <div id="stampBar" class="hidden">
    <button data-stamp="👏">👏</button>
    <button data-stamp="🎉">🎉</button>
    <button data-stamp="🔥">🔥</button>
    <button data-stamp="😲">😲</button>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ▼▼▼ host.htmlと同じFirebase設定をここにも貼る ▼▼▼ */
const firebaseConfig = {
  apiKey: "AIzaSyDw39Gg8eva5YGr4x1YDzu-GfSYnzHRDQQ",
  authDomain: "quiz-allstar-c4612.firebaseapp.com",
  databaseURL: "https://quiz-allstar-c4612-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "quiz-allstar-c4612",
  storageBucket: "quiz-allstar-c4612.firebasestorage.app",
  messagingSenderId: "812802367303",
  appId: "1:812802367303:web:5531f2909bb76843cf3662"
};
/* ▲▲▲ ここまで ▲▲▲ */

const COLORS = ["c0","c1","c2","c3"];
const LABELS = ["A","B","C","D"];
const SESSION_KEY = "galaxyq_session";
let db = null;
if (typeof firebase === "undefined") {
  // 通信の部品（Firebase）が読み込めなかった（回線の瞬断など）→ 自動で読み込み直す
  document.body.insertAdjacentHTML("afterbegin", '<div class="warn" style="position:relative;z-index:99;font-size:18px;text-align:center">通信が不安定なため読み込めませんでした。<br>3秒後に自動で読み込み直します…</div>');
  setTimeout(() => location.reload(), 3000);
  throw new Error("firebase not loaded");
}
if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} else {
  document.getElementById("configWarn").classList.remove("hidden");
}
// サーバーの時計に合わせる
let serverOffset = 0;
if (db) db.ref(".info/serverTimeOffset").on("value", s => { serverOffset = s.val() || 0; });
const now = () => Date.now() + serverOffset;
const $ = id => document.getElementById(id);

let pin = null, myId = null, myTeam = null, myTeamName = "", myName = "", myAlive = true, myRep = false, myAud = 0, myExists = false;
let qCache = null, readyQi = -1, metaSeq = 0, currentQi = -1, role = "ans", picked = -1, predicted = -1, curEndsAt = 0, timerInt = null, lastStamp = 0, shownKey = "";

const err = m => $("joinErr").textContent = m;

// ===== 前回の続きから参加（画面ロック・再読み込み対策） =====
(async () => {
  if (!db) return;
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SESSION_KEY) || "null"); } catch(e) {}
  if (!s || !s.pin || !s.myId) return;
  err("前回の参加を確認中…");
  const ps = await db.ref(`rooms/${s.pin}/players/${s.myId}`).once("value");
  if (!ps.exists()) { localStorage.removeItem(SESSION_KEY); err(""); return; }
  pin = s.pin; myId = s.myId;
  const p = ps.val();
  myTeam = p.team; myName = p.name;
  const t = await db.ref(`rooms/${pin}/teams/${myTeam}/name`).once("value");
  myTeamName = t.val() || "";
  err("");
  enterRoom();
})();

$("pinBtn").onclick = async () => {
  if (!db) { err("設定がまだです。主催者に確認してね"); return; }
  pin = $("pinIn").value.trim();
  if (pin.length !== 4) { err("番号は4けたで入れてね"); return; }
  const snap = await db.ref("rooms/" + pin + "/teams").once("value");
  if (!snap.exists()) { err("その番号の部屋が見つからないよ"); return; }
  const teams = snap.val();
  const sel = $("teamSel");
  sel.innerHTML = "";
  Object.entries(teams).forEach(([tid, t]) => { const o = document.createElement("option"); o.value = tid; o.textContent = t.name; sel.appendChild(o); });
  $("joinStep2").classList.remove("hidden");
  err("");
};

$("joinBtn").onclick = async () => {
  const name = $("nameIn").value.trim();
  myTeam = $("teamSel").value;
  if (!name) { err("名前を入れてね"); return; }
  $("joinBtn").disabled = true;
  const ps = await db.ref("rooms/" + pin + "/players").once("value");
  if (Object.values(ps.val() || {}).some(p => p.name === name)) {
    err("同じ名前の人がいるよ。少し変えてね（例：たろう2）");
    $("joinBtn").disabled = false;
    return;
  }
  const tSnap = await db.ref("rooms/" + pin + "/teams/" + myTeam + "/name").once("value");
  myTeamName = tSnap.val() || "";
  const ref = db.ref("rooms/" + pin + "/players").push();
  myId = ref.key; myName = name;
  await ref.set({ name, team: myTeam, alive: true, score: 0, rep: false, audPts: 0, online: true });
  localStorage.setItem(SESSION_KEY, JSON.stringify({ pin, myId }));
  enterRoom();
};

function enterRoom() {
  $("joinCard").classList.add("hidden");
  $("stampBar").classList.remove("hidden");
  $("waitName").textContent = myName + " さん";
  $("waitTeam").textContent = "チーム：" + myTeamName;
  show("waitCard");
  keepScreenOn();
  watch();
}

function show(id) {
  ["waitCard","consultCard","ansCard","resultCard","pingCard"].forEach(x => $(x).classList.toggle("hidden", x !== id));
}

// ===== 接続の見える化 =====
let connected = false, hbInt = null;
function renderConn() {
  const d = $("connDot");
  d.classList.remove("hidden");
  d.classList.toggle("bad", !connected);
  d.textContent = connected ? "🟢 接続中" : "🔴 接続が切れています。電波・Wi-Fiを確認してね";
}
function heartbeat() {
  if (!myExists || !connected) return;
  db.ref(`rooms/${pin}/players/${myId}`).update({ online: true, hb: firebase.database.ServerValue.TIMESTAMP });
}
// ===== 画面を消さない（対応しているスマホのみ。ページを開いている間だけ） =====
let wakeLock = null;
async function keepScreenOn() {
  try {
    if (!("wakeLock" in navigator) || document.visibilityState !== "visible" || wakeLock) return;
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
// ===== 通信が長く切れたときの自動復旧 =====
// 15秒つながらない → 接続をやり直す。さらに続き、ネットが戻っていればページを読み込み直す（続きから参加できる）
let lostAt = 0, recoverInt = null;
function startRecovery() {
  if (recoverInt) return;
  lostAt = Date.now();
  recoverInt = setInterval(() => {
    if (connected) { clearInterval(recoverInt); recoverInt = null; return; }
    const gone = Date.now() - lostAt;
    if (gone >= 15000 && gone < 40000) { try { db.goOffline(); db.goOnline(); } catch (e) {} }
    if (gone >= 40000 && navigator.onLine && document.visibilityState === "visible" && localStorage.getItem(SESSION_KEY)) {
      clearInterval(recoverInt); recoverInt = null;
      location.reload();
    }
  }, 5000);
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  keepScreenOn();
  heartbeat();
  // スマホを開き直したときに切れていたら、すぐ接続をやり直す
  if (myExists && !connected) { try { db.goOffline(); db.goOnline(); } catch (e) {} }
});
window.addEventListener("online", () => { if (myExists && !connected) { try { db.goOffline(); db.goOnline(); } catch (e) {} } });
function startTimer(endsAt, elId, danger, onEnd) {
  clearInterval(timerInt);
  const el = $(elId);
  el.classList.remove("danger");
  timerInt = setInterval(() => {
    const left = Math.max(0, endsAt - now());
    el.textContent = Math.ceil(left / 1000);
    if (danger) el.classList.toggle("danger", left <= 5000 && left > 0);
    if (left <= 0) { clearInterval(timerInt); if (onEnd) onEnd(); }
  }, 100);
}

let toastT = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.add("hidden"), 1600);
}
// state: "wait"＝読み上げ中（押すと「まだです」）／"open"＝回答できる／"closed"＝締切
function renderButtons(q, kind, state, chosen) {
  const grid = $("btnGrid");
  grid.innerHTML = "";
  $("sendState").className = "msg sendState" + (chosen >= 0 ? " ok" : "");
  $("sendState").textContent = chosen >= 0 ? "✅ 司会の画面に届きました" : "";
  q.choices.forEach((c, j) => {
    const b = document.createElement("button");
    b.className = `abtn ${COLORS[j]} ${kind === "pred" ? "pred" : ""} ${state === "wait" ? "wait" : ""}`;
    b.innerHTML = LABELS[j] + "<small></small>";
    b.querySelector("small").textContent = c;
    b.disabled = state === "closed" || chosen >= 0;
    if (chosen >= 0) b.classList.add(j === chosen ? "picked" : "dim");
    b.onclick = () => {
      if (state === "wait") { toast("まだです！\n司会の「回答スタート」の合図を待ってね"); return; }
      kind === "pred" ? predict(j) : pick(j);
    };
    grid.appendChild(b);
  });
}
function setRoleView(isPred) {
  $("ansCard").classList.toggle("predMode", isPred);
  $("predBanner").classList.toggle("hidden", !isPred);
  $("predBanner").innerHTML = isPred
    ? (myAlive ? "📣 代表者対決：あなたは予想で参加<small>当たると観客ポイント（チームの点にはなりません）</small>"
               : "🔮 あなたは脱落中：予想投票<small>当たると観客ポイント。次のピリオドで復活できます</small>")
    : "";
}

function watch() {
  const room = db.ref("rooms/" + pin);
  // 通信が切れたら「オフライン」にするだけで、名簿からは消さない
  const offs = [];
  const listen = (ref, fn) => { ref.on("value", fn); offs.push(() => ref.off("value", fn)); };
  listen(db.ref(".info/connected"), s => {
    connected = s.val() === true;
    renderConn();
    if (!connected) { if (myExists) startRecovery(); return; }
    if (!myExists) return;
    room.child("players/" + myId + "/online").onDisconnect().set(false);
    heartbeat();
  });
  // 問題文を常に受け取っておく（出題の瞬間にすぐ表示できるように）
  listen(room.child("question"), s => { qCache = s.val(); });
  // 待機画面の注意事項（司会画面で「Wi-Fiオフ」か「会場Wi-Fi」を切り替えられる）
  listen(room.child("notice"), s => {
    const wifi = s.val() === "wifi";
    $("noticeBox").innerHTML = `<div class="nt">⚠️ 始まる前に確認してね</div>` +
      (wifi ? "📶 <b>会場のWi-Fiにつなぐ</b>（運営の案内のとおり）<br>" : "📶 <b>Wi-Fiはオフ</b>（スマホの回線を使う）<br>") +
      "🔋 <b>省電力モード（低電力モード）はオフ</b><br>" +
      "📱 <b>このページを開いたまま</b>（画面は自動で消えません）<br>" +
      "✅ 右上が <b>🟢 接続中</b> ならOK！";
  });
  clearInterval(hbInt);
  hbInt = setInterval(heartbeat, 10000);
  listen(room.child("players/" + myId), s => {
    const p = s.val();
    if (!p) {
      if (myExists) {
        // 主催者に外された／部屋が閉じられた（切断時の書き込み予約も取り消す＝消えた部屋を作り直さない）
        room.child("players/" + myId + "/online").onDisconnect().cancel();
        myExists = false;
        localStorage.removeItem(SESSION_KEY);
        offs.forEach(f => f());
        clearInterval(hbInt);
        clearInterval(timerInt);
        $("connDot").classList.add("hidden");
        show("");
        $("stampBar").classList.add("hidden");
        $("joinCard").classList.remove("hidden");
        $("joinStep2").classList.add("hidden");
        err("部屋が終了したか、参加が取り消されました。もう一度参加するときは番号を入れてね");
      }
      return;
    }
    const first = !myExists;
    myExists = true;
    if (first) {
      room.child("players/" + myId + "/online").onDisconnect().set(false);
      heartbeat();
    }
    myAlive = p.alive !== false; myRep = !!p.rep; myAud = p.audPts || 0;
    $("audView").textContent = myAud > 0 ? `🔮 観客ポイント：${myAud}` : "";
  });
  listen(room.child("teamState/" + myTeam + "/points"), s => {
    const txt = "チームの点数：" + (s.val() || 0) + "点";
    $("waitPoints").textContent = txt;
    $("resultPoints").textContent = txt;
  });
  listen(room.child("meta"), async snap => {
    const meta = snap.val();
    if (!meta) return;
    const key = [meta.state, meta.qi, meta.period, meta.nonce || ""].join(":");
    if (key === shownKey) return;
    shownKey = key;
    // 読み込み待ちの間に次の状態が来たら、古い方の表示は捨てる（順番の入れ替わり対策）
    const seq = ++metaSeq;
    const stale = () => seq !== metaSeq;
    const mode = meta.mode || "points";
    if (meta.qi !== currentQi && ["consult","reading","question"].includes(meta.state)) {
      currentQi = meta.qi; picked = -1; predicted = -1;
    }
    if (meta.state === "lobby") { show("waitCard"); return; }

    if (meta.state === "ping") {
      clearInterval(timerInt);
      pingNonce = meta.nonce;
      $("pingBtn").disabled = false;
      $("pingBtn").textContent = "ここをタップ！";
      $("pingMsg").textContent = "司会の画面にあなたの名前が出るか確認します";
      show("pingCard");
      if (navigator.vibrate) navigator.vibrate(120);
      return;
    }

    // 手元に届いている問題文をすぐ使う（サーバーへの問い合わせ待ちをなくす）
    const getQ = async () => (qCache && qCache.qi === meta.qi) ? qCache : (await room.child("question").once("value")).val();
    if (meta.state === "consult") {
      const q = await getQ();
      readyQi = meta.qi;
      if (stale()) return;
      $("consultQ").textContent = q ? q.text : "";
      show("consultCard");
      startTimer(meta.endsAt || 0, "consultTimer", true);
      return;
    }

    if (meta.state === "reading" || meta.state === "question") {
      const q = await getQ();
      if (!q || stale()) return;
      role = (myAlive && (mode !== "rep" || myRep)) ? "ans" : "pred";
      $("qTextP").textContent = q.text;
      $("roleBadge").className = "badge" + (role === "pred" ? " predB" : "");
      $("roleBadge").textContent = role === "pred" ? "予想で参加" : "✋ 回答者";
      setRoleView(role === "pred");
      $("dblBadge").classList.toggle("hidden", !meta.dbl);
      if (meta.state === "reading") {
        readyQi = meta.qi;
        clearInterval(timerInt);
        $("timerView").textContent = "";
        $("timerView").classList.remove("danger");
        renderButtons(q, role, "wait", -1);
        $("pickedMsg").textContent = role === "pred" ? "問題を読み上げ中…合図で予想スタート！" : "問題を読み上げ中…合図で回答スタート！";
        show("ansCard");
        return;
      }
      curEndsAt = meta.endsAt || 0;
      // 再接続したときのために、すでに送った回答・予想を読み込む
      // 読み上げ中から見ていた問題なら、まだ答えていないので問い合わせは不要（すぐ押せるようにする）
      if (readyQi !== meta.qi) {
        const path = role === "pred" ? "predictions" : "answers";
        const prev = (await room.child(`${path}/${meta.qi}/${myId}`).once("value")).val();
        if (stale()) return;
        if (prev) { if (role === "pred") predicted = prev.choice; else picked = prev.choice; }
      }
      const chosen = role === "pred" ? predicted : picked;
      const open = now() < curEndsAt;
      if (open && chosen < 0 && navigator.vibrate) navigator.vibrate(120);
      renderButtons(q, role, open ? "open" : "closed", chosen);
      if (chosen >= 0) $("pickedMsg").textContent = `${LABELS[chosen]} で${role === "pred" ? "予想" : "回答"}したよ。結果を待とう`;
      else if (!open) $("pickedMsg").textContent = "締切！ 結果を待とう";
      else $("pickedMsg").textContent = role === "pred"
        ? "正解だと思う色をタップ！当たると観客ポイント"
        : (myRep && mode === "rep" ? "代表として回答！チームのために！" : "色をタップして回答！");
      show("ansCard");
      startTimer(curEndsAt, "timerView", true, () => {
        if ((role === "pred" ? predicted : picked) < 0) {
          $("btnGrid").querySelectorAll(".abtn").forEach(b => b.disabled = true);
          $("pickedMsg").textContent = "締切！ 結果を待とう";
        }
      });
      return;
    }

    if (meta.state === "reveal") {
      clearInterval(timerInt);
      const correct = meta.correct;
      const gain = meta.gains && meta.gains[myTeam] ? meta.gains[myTeam].pts : 0;
      let msg, sub, win = false;
      if (currentQi !== meta.qi) {
        msg = "正解発表"; sub = `正解は ${LABELS[correct]} でした`;
      } else if (role === "pred") {
        if (predicted === correct) { msg = "🔮 予想的中！"; sub = "観客ポイント +1"; win = true; }
        else if (predicted === -1) { msg = "正解発表"; sub = `正解は ${LABELS[correct]}。次は予想してみよう`; }
        else { msg = "予想ハズレ…"; sub = `正解は ${LABELS[correct]} でした`; }
      } else if (picked === correct) {
        msg = "🎉 正解！"; win = true;
        sub = mode === "survival" ? "生き残り！次もがんばろう" : `チームに +${gain}点`;
      } else if (mode === "survival") {
        msg = "<span class='out'>脱落…！</span>";
        sub = `正解は ${LABELS[correct]}。ここからは予想投票で参加しよう！`;
      } else if (picked === -1) {
        msg = "時間切れ…"; sub = `正解は ${LABELS[correct]} でした`;
      } else {
        msg = "残念、不正解"; sub = `正解は ${LABELS[correct]} でした`;
      }
      $("resultMsg").classList.toggle("win", win);
      $("resultMsg").innerHTML = msg;
      $("resultSub").textContent = sub;
      show("resultCard");
      return;
    }

    if (meta.state === "period") {
      clearInterval(timerInt);
      const me = meta.winnerPid && meta.winnerPid === myId;
      $("resultMsg").classList.toggle("win", !!me);
      $("resultMsg").textContent = me ? "🏆 ピリオド優勝！" : `ピリオド${meta.period} 終了！`;
      $("resultSub").textContent = (meta.winner ? `優勝：${meta.winner}さん。` : "") + "全員復活！次のピリオドもがんばろう";
      show("resultCard");
      return;
    }

    if (meta.state === "awards") {
      clearInterval(timerInt);
      $("resultMsg").classList.remove("win");
      $("resultMsg").textContent = "🏆 結果発表中！";
      $("resultSub").textContent = "大画面に注目！";
      show("resultCard");
      return;
    }

    if (meta.state === "finished") {
      clearInterval(timerInt);
      let msg = "結果発表", win = false;
      if (meta.champPid === myId) { msg = "🏆 優勝！Galaxyマスター！"; win = true; }
      else if (meta.audKingPid === myId) { msg = "🔮 観客王！"; win = true; }
      else if (meta.champTeam && meta.champTeam === myTeam) { msg = "🤝 ベストチーム賞！"; win = true; }
      $("resultMsg").classList.toggle("win", win);
      $("resultMsg").textContent = msg;
      $("resultSub").textContent = "順位は大画面を見てね。おつかれさま！";
      show("resultCard");
    }
  });
}

// 送った答えがサーバーに届いたかを本人に見せる
async function send(path, j) {
  $("btnGrid").querySelectorAll(".abtn").forEach((b, k) => {
    b.disabled = true;
    b.classList.add(k === j ? "picked" : "dim");
  });
  const st = $("sendState");
  st.className = "msg sendState";
  st.textContent = "送信中…";
  let done = false;
  const slowT = setTimeout(() => {
    if (done) return;
    st.className = "msg sendState slow";
    st.textContent = "⚠️ まだ届いていません。電波・Wi-Fiを確認してね（つながると自動で送られます）";
  }, 3000);
  try {
    await db.ref(`rooms/${pin}/${path}/${currentQi}/${myId}`).set({ choice: j, t: firebase.database.ServerValue.TIMESTAMP });
    done = true; clearTimeout(slowT);
    st.className = "msg sendState ok";
    st.textContent = "✅ 司会の画面に届きました";
  } catch (e) {
    done = true; clearTimeout(slowT);
    st.className = "msg sendState slow";
    st.textContent = "⚠️ 送れませんでした。近くのスタッフに知らせてね";
  }
}
let pingNonce = "";
$("pingBtn").onclick = async () => {
  if (!pingNonce || $("pingBtn").disabled) return;
  $("pingBtn").disabled = true;
  $("pingBtn").textContent = "送信中…";
  const slowT = setTimeout(() => { $("pingMsg").textContent = "⚠️ 届くのに時間がかかっています。電波・Wi-Fiを確認してね"; }, 3000);
  try {
    await db.ref(`rooms/${pin}/pings/${pingNonce}/${myId}`).set(firebase.database.ServerValue.TIMESTAMP);
    clearTimeout(slowT);
    $("pingBtn").textContent = "✅ 接続OK！";
    $("pingMsg").textContent = "司会の画面に届きました。このまま待っててね";
  } catch (e) {
    clearTimeout(slowT);
    $("pingBtn").disabled = false;
    $("pingBtn").textContent = "もう一度タップ";
    $("pingMsg").textContent = "⚠️ 送れませんでした。近くのスタッフに知らせてね";
  }
};
async function pick(j) {
  if (picked >= 0 || now() > curEndsAt) return;
  picked = j;
  $("pickedMsg").textContent = LABELS[j] + " で回答したよ。結果を待とう";
  await send("answers", j);
}
async function predict(j) {
  if (predicted >= 0 || now() > curEndsAt) return;
  predicted = j;
  $("pickedMsg").textContent = LABELS[j] + " を予想したよ。結果を待とう";
  await send("predictions", j);
}

document.querySelectorAll("#stampBar button").forEach(b => b.onclick = async () => {
  const t = Date.now();
  if (t - lastStamp < 1500 || !pin) return;
  lastStamp = t;
  await db.ref(`rooms/${pin}/stamps`).push({ e: b.dataset.stamp, t });
});
</script>
